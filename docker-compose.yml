# Local Postgres for development — matches DATABASE_URL in .env.example.
# `docker compose up -d` → `npx prisma migrate deploy` → `npm run dev`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadworks
      POSTGRES_PASSWORD: leadworks
      POSTGRES_DB: leadworks
    ports:
      - "5432:5432"
    volumes:
      - leadworks-pg:/var/lib/postgresql/data

volumes:
  leadworks-pg:
